<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0f14;
      color: #e8eaed;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo {
      font-size: 18px;
      font-weight: 600;
      color: #7bb8f0;
      font-style: italic;
    }
    .logo-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #7bb8f0;
      display: inline-block;
    }
    .version {
      font-size: 10px;
      color: #6a7080;
      margin-left: auto;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #181c23;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.active { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.4); }
    .status-dot.inactive { background: #6a7080; }
    .status-label {
      font-size: 12px;
      color: #9ca8b9;
    }
    .status-label strong {
      color: #e8eaed;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 8px;
    }
    .btn-start {
      background: #7bb8f0;
      color: #0d0f14;
    }
    .btn-start:hover { background: #93c6f5; }
    .btn-stop {
      background: rgba(255,107,107,0.15);
      color: #ff6b6b;
      border: 1px solid rgba(255,107,107,0.2);
    }
    .btn-stop:hover { background: rgba(255,107,107,0.25); }
    .caption-count {
      text-align: center;
      font-size: 11px;
      color: #6a7080;
      margin-top: 4px;
    }
    .tip {
      margin-top: 12px;
      padding: 8px 10px;
      background: rgba(123,184,240,0.06);
      border: 1px solid rgba(123,184,240,0.12);
      border-radius: 8px;
      font-size: 11px;
      color: #9ca8b9;
      line-height: 1.5;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo-dot"></span>
    <span class="logo">ambi</span>
    <span class="version">v1.0</span>
  </div>

  <div class="status-row">
    <span class="status-dot" id="meetDot"></span>
    <span class="status-label" id="meetStatus">Checking Google Meet…</span>
  </div>

  <div class="status-row">
    <span class="status-dot" id="captureDot"></span>
    <span class="status-label" id="captureStatus">Not capturing</span>
  </div>

  <button class="btn btn-start" id="startBtn">Start Capturing Captions</button>
  <button class="btn btn-stop hidden" id="stopBtn">Stop Capturing</button>

  <div class="caption-count" id="countLabel"></div>

  <div class="tip">
    <strong>Tip:</strong> Make sure captions are turned ON in your Google Meet
    (press <strong>C</strong> in the call) and Ambi is open in another tab.
  </div>

  <script src="popup.js"></script>
</body>
</html>
