  <text x="92" y="114" text-anchor="middle" font-size="10" font-weight="600" fill="#1D4ED8">Browser</text>
  <text x="92" y="129" text-anchor="middle" font-size="8" fill="#3B82F6">Google OAuth</text>
  <text x="92" y="142" text-anchor="middle" font-size="8" fill="#3B82F6">PKCE flow</text>

  <!-- Session -->
  <rect x="42" y="162" width="100" height="42" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
