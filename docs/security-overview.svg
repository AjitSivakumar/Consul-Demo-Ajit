  <rect x="208" y="90" width="192" height="282" rx="8" fill="#fff" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="304" y="107" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="0.8">CLIENT</text>

