<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#16A34A"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- Page -->
  <rect width="860" height="520" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Ambi — Optimal Security Architecture</text>
  <text x="430" y="50" text-anchor="middle" font-size="10" fill="#94A3B8" letter-spacing="0.5">All connections TLS-encrypted · No secret keys exposed to browser</text>

  <!-- ══ USER (x=28, w=128, h=316, bottom=388) ══ -->
  <rect x="28" y="66" width="128" height="316" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="92" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">USER</text>

  <!-- Browser -->
