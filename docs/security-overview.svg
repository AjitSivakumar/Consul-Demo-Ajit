  <rect x="348" y="444" width="126" height="36" rx="6" fill="#fff" stroke="#C4B5FD" stroke-width="1"/>
  <text x="411" y="459" text-anchor="middle" font-size="9" font-weight="600" fill="#4C1D95">Group Docs</text>
  <text x="411" y="473" text-anchor="middle" font-size="8" fill="#7C3AED">RLS · pgvector</text>

  <rect x="486" y="444" width="148" height="36" rx="6" fill="#fff" stroke="#C4B5FD" stroke-width="1"/>
  <text x="560" y="459" text-anchor="middle" font-size="9" font-weight="600" fill="#4C1D95">OAuth Tokens</text>
  <text x="560" y="473" text-anchor="middle" font-size="8" fill="#7C3AED">encrypted · server access only</text>

  <!-- ══ ARROWS ══ -->
  <line x1="156" y1="222" x2="194" y2="222" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/>
