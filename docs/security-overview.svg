  <text x="763" y="232" text-anchor="middle" font-size="8" fill="#64748B">gpt-4o-mini</text>

  <rect x="706" y="252" width="114" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="763" y="269" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Recall.ai</text>
  <text x="763" y="284" text-anchor="middle" font-size="8" fill="#64748B">bot · transcripts</text>

  <rect x="706" y="304" width="114" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
