  <text x="521" y="268" text-anchor="middle" font-size="8" fill="#16A34A">HMAC webhook validation</text>
  <text x="521" y="280" text-anchor="middle" font-size="8" fill="#16A34A">auth-gated transcripts</text>

  <rect x="420" y="294" width="202" height="44" rx="6" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1"/>
  <text x="521" y="311" text-anchor="middle" font-size="10" font-weight="600" fill="#15803D">JWT Validation</text>
  <text x="521" y="326" text-anchor="middle" font-size="8" fill="#16A34A">every request · group check</text>

